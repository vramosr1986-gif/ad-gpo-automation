<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .h   { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .t   { font-size: 15px;   font-weight: 700; fill: #0f172a; }
      .s   { font-size: 12.5px; fill: #334155; }
      .m   { font-size: 12px;   fill: #334155; font-family: Consolas, Menlo, monospace; }
      .w   { font-size: 12.5px; fill: #ffffff; font-weight: 600; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .ln  { stroke: #64748b; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="660" rx="14" fill="#f8fafc"/>

  <!-- título -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Identity Lifecycle as Code</text>
  <text x="40" y="70" class="s">Altas, cambios y bajas en Active Directory gobernados desde Git, validados en CI y aplicados con Ansible (AWX)</text>

  <!-- cabeceras de columna -->
  <text x="40"   y="110" class="h">1 · ORIGEN</text>
  <text x="290"  y="110" class="h">2 · GOBIERNO</text>
  <text x="540"  y="110" class="h">3 · VALIDACIÓN (CI)</text>
  <text x="790"  y="110" class="h">4 · ORQUESTACIÓN (AWX)</text>
  <text x="1040" y="110" class="h">5 · DIRECTORIO</text>

  <!-- ============ 1 ORIGEN ============ -->
  <rect x="40" y="125" width="200" height="100" rx="10" class="box"/>
  <rect x="40" y="125" width="6" height="100" rx="3" fill="#2563eb"/>
  <text x="58" y="152" class="t">Fuente de verdad</text>
  <text x="58" y="176" class="m">hr/employees.yml</text>
  <text x="58" y="196" class="s">Exportación de RRHH en Git</text>
  <text x="58" y="214" class="s">Clave inmutable: employee_id</text>

  <rect x="40" y="245" width="200" height="100" rx="10" class="box"/>
  <rect x="40" y="245" width="6" height="100" rx="3" fill="#2563eb"/>
  <text x="58" y="272" class="t">Petición</text>
  <text x="58" y="296" class="s">Ticket en GLPI</text>
  <text x="58" y="316" class="s">Alta · cambio · baja</text>
  <text x="58" y="334" class="s">Crea la PR automáticamente</text>

  <!-- ============ 2 GOBIERNO ============ -->
  <rect x="290" y="125" width="200" height="220" rx="10" class="box"/>
  <rect x="290" y="125" width="6" height="220" rx="3" fill="#7c3aed"/>
  <text x="308" y="152" class="t">Pull Request</text>
  <text x="308" y="180" class="s">• Revisión obligatoria</text>
  <text x="308" y="202" class="s">• CODEOWNERS por</text>
  <text x="320" y="220" class="s">departamento</text>
  <text x="308" y="242" class="s">• Solicitante ≠ aprobador</text>
  <text x="308" y="264" class="s">• Commits firmados</text>
  <text x="308" y="286" class="s">• Recertificación</text>
  <text x="320" y="304" class="s">trimestral de accesos</text>
  <text x="308" y="322" class="s" style="fill:#7c3aed;font-weight:600">Trazabilidad</text>
  <text x="308" y="338" class="s" style="fill:#7c3aed;font-weight:600">ticket → PR → ejecución</text>

  <!-- ============ 3 VALIDACIÓN ============ -->
  <g>
    <rect x="540" y="125" width="200" height="38" rx="8" class="box"/>
    <circle cx="560" cy="144" r="8" fill="#16a34a"/><path d="M556,144 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="576" y="148" class="s">ansible-lint</text>

    <rect x="540" y="171" width="200" height="38" rx="8" class="box"/>
    <circle cx="560" cy="190" r="8" fill="#16a34a"/><path d="M556,190 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="576" y="194" class="s">JSON Schema de datos</text>

    <rect x="540" y="217" width="200" height="38" rx="8" class="box"/>
    <circle cx="560" cy="236" r="8" fill="#16a34a"/><path d="M556,236 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="576" y="240" class="s">Reglas SoD</text>

    <rect x="540" y="263" width="200" height="38" rx="8" class="box"/>
    <circle cx="560" cy="282" r="8" fill="#16a34a"/><path d="M556,282 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="576" y="286" class="s">Tests pytest · Pester</text>

    <rect x="540" y="309" width="200" height="38" rx="8" class="box"/>
    <circle cx="560" cy="328" r="8" fill="#16a34a"/><path d="M556,328 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="576" y="332" class="s">DC efímero (Vagrant)</text>
  </g>
  <text x="540" y="372" class="s" style="fill:#b91c1c;font-weight:600">Si algo falla, no se aplica nada</text>

  <!-- ============ 4 ORQUESTACIÓN ============ -->
  <rect x="790" y="125" width="200" height="56" rx="10" class="box"/>
  <text x="808" y="148" class="t">Plan</text>
  <text x="808" y="168" class="m">--check --diff</text>

  <rect x="790" y="199" width="200" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="808" y="222" class="t" style="fill:#b91c1c">Circuit breaker</text>
  <text x="808" y="242" class="s">Aborta si afecta &gt; 2 % del AD</text>

  <rect x="790" y="273" width="200" height="56" rx="10" class="box"/>
  <text x="808" y="296" class="t">Backup previo</text>
  <text x="808" y="316" class="s">Objetos + membresías (JSON)</text>

  <rect x="790" y="347" width="200" height="56" rx="10" fill="#0f172a"/>
  <text x="808" y="370" class="w" style="font-size:15px;font-weight:700">Aplicar</text>
  <text x="808" y="390" class="s" style="fill:#cbd5e1">Módulo propio · por lotes</text>

  <path d="M890,181 v14"  class="ln" marker-end="url(#arr)"/>
  <path d="M890,255 v14"  class="ln" marker-end="url(#arr)"/>
  <path d="M890,329 v14"  class="ln" marker-end="url(#arr)"/>

  <!-- ============ 5 DIRECTORIO ============ -->
  <rect x="1040" y="125" width="200" height="66" rx="10" class="box"/>
  <rect x="1040" y="125" width="6" height="66" rx="3" fill="#ea580c"/>
  <text x="1058" y="150" class="t">Endpoint JEA</text>
  <text x="1058" y="170" class="s">WinRM HTTPS + Kerberos</text>
  <text x="1058" y="186" class="s">Solo cmdlets permitidos</text>

  <rect x="1040" y="209" width="200" height="194" rx="10" class="box"/>
  <rect x="1040" y="209" width="6" height="194" rx="3" fill="#0891b2"/>
  <text x="1058" y="234" class="t">lab.local</text>
  <rect x="1056" y="246" width="82" height="40" rx="6" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1097" y="263" class="s" text-anchor="middle" font-weight="600">DC01</text>
  <text x="1097" y="279" class="s" text-anchor="middle" style="font-size:10px">PDC emulator</text>
  <rect x="1152" y="246" width="82" height="40" rx="6" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1193" y="263" class="s" text-anchor="middle" font-weight="600">DC02</text>
  <text x="1193" y="279" class="s" text-anchor="middle" style="font-size:10px">emea.lab.local</text>
  <text x="1145" y="271" class="s" text-anchor="middle" style="font-size:14px">⇄</text>
  <text x="1058" y="312" class="m">OU=Tier0</text>
  <text x="1058" y="332" class="m">OU=Tier1</text>
  <text x="1058" y="352" class="m">OU=Tier2</text>
  <text x="1058" y="372" class="m">OU=Disabled</text>
  <text x="1150" y="312" class="s" style="font-size:11px">AGDLP</text>
  <text x="1150" y="328" class="s" style="font-size:11px">ROL → RES</text>

  <!-- flechas entre columnas -->
  <path d="M240,175 h46"  class="ln" marker-end="url(#arr)"/>
  <path d="M240,295 h46"  class="ln" marker-end="url(#arr)"/>
  <path d="M490,235 h46"  class="ln" marker-end="url(#arr)"/>
  <path d="M740,153 h46"  class="ln" marker-end="url(#arr)"/>
  <path d="M990,375 h20 v-217 h26" class="ln" marker-end="url(#arr)"/>
  <path d="M1140,191 v14" class="ln" marker-end="url(#arr)"/>

  <!-- ============ TRANSVERSALES ============ -->
  <line x1="40" y1="430" x2="1240" y2="430" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="458" class="h">SERVICIOS TRANSVERSALES</text>

  <rect x="40" y="472" width="280" height="96" rx="10" class="box"/>
  <text x="58" y="500" class="t">Secretos</text>
  <text x="58" y="524" class="s">HashiCorp Vault</text>
  <text x="58" y="542" class="s">Credenciales de corta duración</text>
  <text x="58" y="560" class="s">y rotación automática</text>

  <rect x="346" y="472" width="280" height="96" rx="10" class="box"/>
  <text x="364" y="500" class="t">Observabilidad</text>
  <text x="364" y="524" class="s">Logs JSON → Loki</text>
  <text x="364" y="542" class="s">Métricas de cada ejecución → Grafana</text>
  <text x="364" y="560" class="s">Duración · cambios · errores</text>

  <rect x="652" y="472" width="280" height="96" rx="10" class="box"/>
  <text x="670" y="500" class="t">Notificación y auditoría</text>
  <text x="670" y="524" class="s">Informe HTML por correo</text>
  <text x="670" y="542" class="s">Ticket actualizado y cerrado</text>
  <text x="670" y="560" class="s">Quién · qué · cuándo</text>

  <rect x="958" y="472" width="282" height="96" rx="10" class="box"/>
  <text x="976" y="500" class="t">Recuperación</text>
  <text x="976" y="524" class="s">AD Recycle Bin · restauración</text>
  <text x="976" y="542" class="s">autoritativa · backup System State</text>
  <text x="976" y="560" class="s">Runbooks y game days probados</text>

  <!-- pie -->
  <text x="40" y="616" class="s" style="fill:#64748b">Ansible · PowerShell · AWX · GLPI · Vault · Loki/Grafana · Windows Server 2022 · Vagrant + VirtualBox</text>
  <text x="1240" y="616" class="s" style="fill:#64748b" text-anchor="end">github.com/…/ad-gpo-automation</text>
</svg>
