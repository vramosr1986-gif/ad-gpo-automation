---
- name: Estado de los controladores de dominio
  hosts: domain_controllers
  gather_facts: false
  tasks:
    - name: Recoger el estado del servidor
      ansible.windows.win_powershell:
        script: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $roles = @{ 0 = 'Estación independiente'; 1 = 'Estación miembro'
                      2 = 'Servidor independiente'; 3 = 'Servidor miembro'
                      4 = 'Controlador de dominio'; 5 = 'Controlador de dominio (PDC)' }
          [ordered]@{
            Equipo  = $env:COMPUTERNAME
            Dominio = if ($cs.PartOfDomain) { $cs.Domain } else { "Grupo de trabajo: $($cs.Workgroup)" }
            Rol     = $roles[[int]$cs.DomainRole]
            AD_DS   = (Get-WindowsFeature AD-Domain-Services).InstallState.ToString()
            DNS     = (Get-WindowsFeature DNS).InstallState.ToString()
            NICs    = @(Get-NetIPAddress -AddressFamily IPv4 |
                        Where-Object IPAddress -ne '127.0.0.1' |
                        ForEach-Object {
                          '{0}  {1}  registra_en_DNS={2}' -f $_.InterfaceAlias, $_.IPAddress,
                            (Get-DnsClient -InterfaceIndex $_.InterfaceIndex).RegisterThisConnectionsAddress
                        })
          }
      register: estado
      changed_when: false

    - name: Mostrar el estado
      ansible.builtin.debug:
        var: estado.output[0]