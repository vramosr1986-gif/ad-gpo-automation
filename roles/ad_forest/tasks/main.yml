---
# Promoción de DCs: el grupo del inventario decide el tipo de dominio.
#   dc_root  → crea el bosque (microsoft.ad.domain)
#   dc_child → crea un dominio hijo en el bosque existente (microsoft.ad.domain_child)

- name: Desactivar el registro en DNS de las NIC que no son del lab (NAT)
  ansible.windows.win_powershell:
    script: |
      $labIf = (Get-NetIPAddress -AddressFamily IPv4 -IPAddress '{{ ansible_host }}').InterfaceIndex
      $Ansible.Changed = $false
      Get-DnsClient |
        Where-Object { $_.InterfaceIndex -ne $labIf -and $_.RegisterThisConnectionsAddress } |
        ForEach-Object {
          Set-DnsClient -InterfaceIndex $_.InterfaceIndex -RegisterThisConnectionsAddress $false
          $Ansible.Changed = $true
        }

- name: Configurar el DC del dominio padre como servidor DNS (solo DC hijo)
  ansible.windows.win_powershell:
    script: |
      param([string[]]$Servers)
      $Ansible.Changed = $false
      Get-NetAdapter | Where-Object Status -eq 'Up' | ForEach-Object {
        $current = @((Get-DnsClientServerAddress -InterfaceIndex $_.ifIndex -AddressFamily IPv4).ServerAddresses)
        if (($current -join ',') -ne ($Servers -join ',')) {
          Set-DnsClientServerAddress -InterfaceIndex $_.ifIndex -ServerAddresses $Servers
          $Ansible.Changed = $true
        }
      }
    parameters:
      Servers: "{{ ad_dns_servers }}"
  when: "'dc_child' in group_names"

- name: Instalar el rol AD DS y sus herramientas de administración
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    state: present
  register: adds_feature

# Solo si el rol se acaba de instalar: un reinicio pendiente por otro motivo
# no debe reiniciar un DC en una ejecución que no cambia nada
- name: Reiniciar solo si el rol AD DS se acaba de instalar y lo pide
  ansible.windows.win_reboot:
  when: adds_feature is changed and adds_feature.reboot_required

- name: Crear el bosque {{ ad_domain_name }} y promover a DC (solo DC raíz)
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_domain_name }}"
    domain_netbios_name: "{{ ad_netbios_name }}"
    safe_mode_password: "{{ ad_dsrm_password }}"
    forest_mode: "{{ ad_forest_mode }}"
    domain_mode: "{{ ad_domain_mode }}"
    install_dns: true
    reboot: true
    reboot_timeout: 1800
  when: "'dc_root' in group_names"

- name: Crear el dominio hijo {{ ad_dc_domain }} y promover a DC (solo DC hijo)
  microsoft.ad.domain_child:
    dns_domain_name: "{{ ad_dc_domain }}"
    domain_admin_user: "{{ ad_enterprise_admin_user }}"
    domain_admin_password: "{{ ad_enterprise_admin_password }}"
    safe_mode_password: "{{ ad_dsrm_password }}"
    domain_mode: "{{ ad_domain_mode }}"
    install_dns: true
    create_dns_delegation: true
    reboot: true
    reboot_timeout: 1800
  when: "'dc_child' in group_names"

- name: Esperar a que Active Directory responda tras la promoción
  ansible.windows.win_powershell:
    script: (Get-ADDomain -ErrorAction Stop).DNSRoot
  register: ad_ready
  until: ad_ready is succeeded
  retries: 30
  delay: 20
  changed_when: false

- name: Hacer que el servidor DNS escuche solo en la IP del lab
  ansible.windows.win_powershell:
    script: |
      $want = '{{ ansible_host }}'
      $current = @((Get-DnsServerSetting -All).ListeningIPAddress | ForEach-Object { "$_" })
      if ($current.Count -eq 1 -and $current[0] -eq $want) {
        $Ansible.Changed = $false
        return
      }
      dnscmd /ResetListenAddresses $want | Out-Null
      Restart-Service DNS

- name: Borrar de las zonas del dominio los registros A con IP fuera del lab
  ansible.windows.win_powershell:
    script: |
      $labPrefix = '{{ ansible_host.rsplit(".", 1)[0] }}.*'
      $Ansible.Changed = $false
      foreach ($zone in @('{{ ad_dc_domain }}', '_msdcs.{{ ad_domain_name }}')) {
        Get-DnsServerResourceRecord -ZoneName $zone -RRType A -ErrorAction SilentlyContinue |
          Where-Object { $_.RecordData.IPv4Address.IPAddressToString -notlike $labPrefix } |
          ForEach-Object {
            Remove-DnsServerResourceRecord -ZoneName $zone -InputObject $_ -Force
            $Ansible.Changed = $true
          }
      }

# La delegación del dominio hijo crea en la zona del padre un registro glue por
# cada IP del DC hijo, también la NAT. Esa zona solo está en el DC del padre.
- name: Borrar en la zona del padre los registros glue con IP fuera del lab (desde el DC raíz)
  ansible.windows.win_powershell:
    script: |
      $labPrefix = '{{ ansible_host.rsplit(".", 1)[0] }}.*'
      $zone = '{{ ad_dc_domain.split(".", 1)[1] }}'
      $Ansible.Changed = $false
      Get-DnsServerResourceRecord -ZoneName $zone -RRType A |
        Where-Object { $_.HostName -like '*.{{ ad_child_name }}' -and
                       $_.RecordData.IPv4Address.IPAddressToString -notlike $labPrefix } |
        ForEach-Object {
          Remove-DnsServerResourceRecord -ZoneName $zone -InputObject $_ -Force
          $Ansible.Changed = $true
        }
  # delegate_to se evalúa antes que when: el default evita el fallo en el DC raíz
  delegate_to: "{{ ad_parent_dc | default(inventory_hostname) }}"
  when: "'dc_child' in group_names"
# Papelera de reciclaje de AD: se activa una vez para todo el bosque y no se puede desactivar
- name: Activar la papelera de reciclaje de AD en el bosque (solo DC raíz, irreversible)
  ansible.windows.win_powershell:
    script: |
      $feature = Get-ADOptionalFeature -Identity 'Recycle Bin Feature'
      if ($feature.EnabledScopes.Count -gt 0) {
        $Ansible.Changed = $false
        return
      }
      Enable-ADOptionalFeature -Identity $feature -Scope ForestOrConfigurationSet `
        -Target '{{ ad_domain_name }}' -Confirm:$false
  when: "'dc_root' in group_names"